# ============================================================
# Docker Compose — Development Environment
# PostgreSQL 16 + Redis 7 + FastAPI + Celery Worker
# ============================================================

services:
  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: callagent_postgres
    environment:
      POSTGRES_DB: callagent_db
      POSTGRES_USER: callagent
      POSTGRES_PASSWORD: callagent_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callagent -d callagent_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: callagent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- FastAPI Application ---
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: callagent_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://callagent:callagent_pass@postgres:5432/callagent_db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - .:/app
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # --- Celery Worker ---
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: callagent_worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://callagent:callagent_pass@postgres:5432/callagent_db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - .:/app
      - ./reports:/app/reports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=10 -Q default,calls,reports

  # --- Celery Beat (Scheduler) ---
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: callagent_beat
    environment:
      - DATABASE_URL=postgresql+asyncpg://callagent:callagent_pass@postgres:5432/callagent_db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
